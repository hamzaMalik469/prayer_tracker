name: prayers_tracker_plus
description: A production-ready Muslim prayer tracking application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  provider: ^6.1.2
  get_it: ^7.6.7

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.1.0

  # ── Prayer Time Calculation ───────────────────────────────────────────────
  # adhan_dart is the actively maintained null-safe Dart 3 port of Adhan.
  # The original 'adhan' package predates null safety and fails on Dart 3.
  adhan_dart: ^1.0.7

  # ── Location ─────────────────────────────────────────────────────────────
  geolocator: ^11.1.0

  # ── Calendar ─────────────────────────────────────────────────────────────
  table_calendar: ^3.1.2

  # ── Local Notifications ───────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.0

  # ── Local Persistence ────────────────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Utilities ────────────────────────────────────────────────────────────
  # Hijri date calculation is implemented manually in Phase 2 using the
  # Kuwaiti algorithm — no broken third-party package required.
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3

  # ── Icons / SVG ───────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6
  timezone: ^0.9.4
  flutter_launcher_icons: ^0.14.4
  sqflite: ^2.4.2+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B6B5A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
